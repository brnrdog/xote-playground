<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xote playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="pg-header">
        <span class="pg-title">xote playground</span>
        <span class="pg-status" id="status">loading compiler…</span>
        <button id="share" type="button">Copy link</button>
      </header>
      <div class="pg-split">
        <section class="pg-editor" id="editor"></section>
        <section class="pg-output">
          <iframe id="preview" sandbox="allow-scripts" title="Preview"></iframe>
          <pre class="pg-errors" id="errors" hidden></pre>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
