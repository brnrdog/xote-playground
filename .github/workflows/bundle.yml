name: Build playground bundle

on:
  push:
    paths:
      - 'bundle/**'
      - 'scripts/build-bundle.sh'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:
  # Rebuild when xote publishes a release that changes the public API.
  repository_dispatch:
    types: [xote-released]

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - uses: ocaml/setup-ocaml@v3
        with:
          # rescript.opam requires ocaml >= 5.0.0; upstream CI builds the
          # playground on 5.3.0, so match that rather than guessing lower.
          # Bump alongside bundle/rescript.version.
          ocaml-compiler: '5.3.0'

      - name: Build bundle
        run: ./scripts/build-bundle.sh

      - name: Verify bundle compiles a xote snippet
        run: node scripts/verify-bundle.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: xote-playground-bundle
          path: dist/
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
