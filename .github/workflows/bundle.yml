name: Build playground bundle

on:
  push:
    paths:
      - 'bundle/**'
      - 'scripts/build-bundle.sh'
      - '.github/workflows/bundle.yml'
  workflow_dispatch:
  # Rebuild when xote publishes a release that changes the public API.
  repository_dispatch:
    types: [xote-released]

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ReScript 12's `rescript` CLI is rewatch, a Rust binary, and the stdlib
      # build (a prerequisite of playground-cmijs) shells out to it. Without
      # cargo, `make playground` builds compiler.js and then dies.
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rewatch/Cargo.toml pins rust-version = "1.91".
          toolchain: '1.91'

      - uses: ocaml/setup-ocaml@v3
        with:
          # rescript.opam requires ocaml >= 5.0.0; upstream CI builds the
          # playground on 5.3.0, so match that rather than guessing lower.
          # Bump alongside bundle/rescript.version.
          ocaml-compiler: '5.3.0'

      # build-bundle.sh reads xote's ppx sources out of node_modules (step 2b
      # links them into the compiler), so the runtime deps have to be present
      # before it runs -- not just before `npm run setup`. npm install rather
      # than npm ci: there is no committed package-lock.json.
      - name: Install runtime deps
        run: npm install

      - name: Build bundle
        run: ./scripts/build-bundle.sh

      - name: Verify bundle compiles a xote snippet
        run: node scripts/verify-bundle.mjs

      # The snippets are the playground's documentation and they are compiled
      # against the bundle that was just built, so a broken example cannot ship.
      - name: Verify snippets compile
        run: npm run test:snippets

      # always(): a bundle that builds but fails verification is still the
      # artifact we want in hand — the previous run threw one away.
      - if: always() && hashFiles('dist/compiler.js') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xote-playground-bundle
          path: dist/
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
